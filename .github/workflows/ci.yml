name: C Build & Test CI

on:
  pull_request:
    branches: [ "**" ] # Khdem 3la ga3 l-PRs 7ta mid-stack!
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC & Make
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build App
        run: make all
      - name: Run Tests
        run: make test